name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: the pipeline only reads the checked-out code.
permissions:
  contents: read

env:
  # No provider credentials exist in CI, so the whole pipeline runs in the explicit, labelled fake
  # mode. Nothing here pretends to exercise Gemini/OpenAI.
  AI_MODE: fake
  DOCKER_BUILDKIT: "1"

jobs:
  quality:
    name: lint, types, encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the dev image (has ruff + mypy)
        run: docker build --build-arg INSTALL_DEV=1 -t app-test .

      - name: ruff (lint)
        run: docker run --rm -v "$PWD:/src" -w /src app-test ruff check .

      - name: ruff (format)
        run: docker run --rm -v "$PWD:/src" -w /src app-test ruff format --check .

      - name: mypy
        run: docker run --rm -v "$PWD:/src:ro" -w /src app-test mypy --cache-dir=/tmp/mypy

      - name: no secrets committed
        run: |
          if grep -rEn 'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}' \
             --include='*.py' --include='*.md' --include='*.yaml' --include='*.yml' \
             --include='*.toml' --include='*.txt' --include='*.sh' --exclude-dir=.git . ; then
            echo "::error::a credential-shaped string is committed"
            exit 1
          fi
          echo "no credential-shaped strings found"

      - name: UTF-8 encoding gate
        run: docker run --rm -v "$PWD:/src:ro" -w /src app-test python scripts/check_encoding.py

  unit:
    name: unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the unit suite in the test image
        run: docker compose --profile test run --rm test

  integration:
    name: integration + e2e (fake providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (Terraform provisions LocalStack first)
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready >/dev/null; then
              echo "ready after ${attempt} attempt(s)"
              curl -sS http://localhost:8000/health/ready
              exit 0
            fi
            sleep 2
          done
          echo "::error::the API never became ready"
          docker compose logs --no-color --tail 100
          exit 1

      - name: Repository and lease fencing against real Redis
        run: |
          docker compose --profile test run --rm \
            -e REDIS_URL=redis://redis:6379/0 \
            test python -m pytest tests/integration/test_repository.py -m repository -q

      - name: API integration and proxy e2e
        run: |
          docker compose --profile test run --rm \
            -e API_BASE_URL=http://api:8000 \
            -e FRONTEND_URL=http://frontend:80 \
            -v "$PWD/samples:/app/samples:ro" \
            test python -m pytest tests/integration/test_api.py tests/e2e \
            -m "integration or e2e" -q

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

  frontend:
    name: frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # The wrapper this action installs is known to swallow exit codes, which turns a hard
          # parse error into a green job. Use the real binary.
          terraform_wrapper: false

      - name: Formatting
        run: terraform fmt -check -recursive infra/

      - name: Validate every environment
        run: |
          for env in infra/envs/local infra/envs/prod; do
            echo "::group::$env"
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
            echo "::endgroup::"
          done
