# There is no authentication in this demo, so the proxy is the only place a request rate can be
# bounded. Uploads are the expensive path (memory + worker time), so they get their own bucket.
# `limit_req_zone` is only legal in the http context, which is why these sit outside `server` — this
# file is included from conf.d/, i.e. inside `http { }`.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Needed because the API upstream is referenced through a
    # variable below: a literal `proxy_pass http://api:8000` resolves ONCE at startup and
    # caches that container IP forever, so recreating only the api container (exactly what
    # the README says to do after adding GEMINI_API_KEY) leaves nginx proxying to a dead IP
    # and the UI returns 502 until the frontend is restarted too.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 429s are JSON, because everything else this API returns is JSON.
    location @too_many_requests {
        default_type application/json;
        return 429 '{"detail":"Rate limit exceeded. Retry shortly.","code":"RATE_LIMITED"}';
    }
    error_page 429 = @too_many_requests;

    # The API accepts PDFs up to 20 MB per file; nginx's default 1 MB limit would 413 real
    # documents before they ever reach it. 25 MB leaves headroom for multipart overhead.
    client_max_body_size 25m;

    # Sane proxy behaviour for uploads and the (bounded) status polling.
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Same-origin API: the bundle calls relative /api/... URLs and this proxies them to the
    # api Compose service. Using a variable makes nginx re-resolve the name (TTL above)
    # instead of pinning the IP; `$request_uri` keeps the original path and query string,
    # which the variable form does not append by itself.
    location = /api/v1/documents {
        limit_req zone=uploads burst=40 nodelay;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
    }

    location /health/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream$request_uri;
    }

    # Hashed build assets are immutable; index.html must never be cached or clients keep an
    # old bundle pointing at deleted asset files.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback for a single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
